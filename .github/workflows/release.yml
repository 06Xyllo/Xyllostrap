name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish self-contained single-file exe
      run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=tag/${{ github.ref_name }} -o publish

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: Xyllostrap ${{ github.ref_name }}
        body_path: .github/RELEASE_NOTES.md
        files: publish/Xyllostrap.exe
